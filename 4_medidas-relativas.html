<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidas relativas</title>
    <style>
         /*
            em = relativa al tamaño de fuente del elemento padre
            rem = relativa al tamaño de fuente del elemento root
            vw = Relative to 1% of the width of the viewport* (the browser window size.)
            vh = Relative to 1% of the height of the viewport*
            ex = Relative to the x-height of the current font (rarely used)
            ch = Relative to width of the "0" (zero)
            vmin = Relative to 1% of viewport's* smaller dimension
            vmax = Relative to 1% of viewport's* larger dimension
            % = Relative to the parent element
        
            - Agrandar/achicar la ventana:
                La caja absoluta siempre mide lo mismo.
                La caja relativa cambia su ancho (50%) porque depende del body.
            - Diferencia de bordes y alto:
                El borde 5px siempre es igual.
                El borde 0.5em depende del tamaño de la fuente: si se cambia el font-size del body en el CSS, el borde relativo crece/disminuye.
        */
    
        body {
            font-size: 15px;
        }   

        /* Caja con medidas ABSOLUTAS */
        .caja-absoluta {
        width: 300px;         /* fijo: siempre 300 píxeles */
        height: 100px;        /* fijo: siempre 100 píxeles */
        border: 5px solid red; /* fijo: 5 píxeles de borde */
        background-color: #f9dada;
        }

        /* Caja con medidas RELATIVAS */
        .caja-relativa {
        width: 50%;           /* relativo: la mitad del ancho del body */
        height: 10em;         /* relativo: depende del tamaño de la fuente base */
        border: 0.5em solid blue; /* relativo: depende del tamaño de la fuente base */
        background-color: #dce7fa;
        }

    </style>
</head>
<body>
    <h1>Unidades Absolutas vs Relativas</h1>

    <div class="caja-absoluta">
        Caja con medidas <strong>ABSOLUTAS</strong><br>
        (width:300px, height:100px, border:5px)
    </div>

    <br>

    <div class="caja-relativa">
        Caja con medidas <strong>RELATIVAS</strong><br>
        (width:50%, height:10em, border:0.5em)
    </div>
</body>

</html>
